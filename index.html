<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1026" />
    <title>NEON RIFT: ANIME WORLDS</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1026;
        color: #e6f7ff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #app {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 40%, #1b1450 0%, #0b1026 70%);
        transition: opacity 0.5s ease;
        z-index: 10;
      }
      .overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .logo {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 4px;
        color: #00e5ff;
        text-shadow: 0 0 12px #00e5ff, 0 0 28px #7c3aed;
      }
      .sub {
        font-size: 13px;
        letter-spacing: 2px;
        color: #c4b5fd;
      }
      #error {
        display: none;
        color: #ff6bd6;
        max-width: 320px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="loading" class="overlay">
      <div class="logo">NEON RIFT</div>
      <div class="sub">ANIME WORLDS</div>
      <div class="sub">Loading...</div>
      <div id="error"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
  </html>
